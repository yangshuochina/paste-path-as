name: Publish Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.1'
        required: true
        type: string
      dry_run:
        description: 'Test and package only; do not publish'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag and publisher
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = require('./package.json');
          if (!/^\d+\.\d+\.\d+$/.test(p.version) || process.env.RELEASE_TAG !== `v${p.version}`) throw new Error('Release tag must match package.json version: vX.Y.Z');
          if (p.publisher !== 'yangshuochina' || p.name !== 'paste-path-as') throw new Error('Unexpected extension identity');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\n`);
          NODE
      - run: npm test
      - name: Package extension
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --allow-missing-repository --out extension.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: extension.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'release' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-vsix
      - name: Check publishing identity configuration
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo '::error::Configure AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment, and authorize the federated identity as a Marketplace publisher contributor. See docs/marketplace-publishing.md.'
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the tested package using Microsoft Entra ID
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath extension.vsix --azure-credential
